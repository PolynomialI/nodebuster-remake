<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nodebuster Remake</title>
    <style>
      /* One visual world: the game's own dark screen. Letterbox = black, like the original's clear colour. */
      :root {
        --screen: #000000;
        --ink: #dcdcdc;
        --muted: #6c6c6c;
        color-scheme: dark;
        height: 100%;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--screen);
        color: var(--ink);
        overflow: hidden;
      }
      #app {
        position: fixed;
        /* Clear of phone system bars; zero everywhere else. */
        inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: var(--screen);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #screen {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #screen.hide-cursor {
        cursor: none;
      }
      /* Not every host resets [hidden]; the display below would override it. */
      #fallback[hidden] {
        display: none;
      }
      #fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding-inline: 16px;
        font: 16px/1.5 ui-monospace, monospace;
        color: var(--ink);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="screen" tabindex="0" aria-label="Nodebuster Remake game screen"></canvas>
      <div id="fallback" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
